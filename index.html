<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenVenture Click-Through</title>
<meta name="description" content="OpenVenture concept demo: real private-company investing, open to everyone, from $25. Fictional companies and figures.">
<meta name="theme-color" content="#0B0D0B">
<link rel="icon" type="image/svg+xml" href="brand/openventure-app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Presenter stage holds one device frame (laptop browser or phone). The app adapts by its own width through container queries. */
:root{
  --stage:#050605;
  --bg:#0B0D0B; --surface:#171A17; --surface-2:#1F231F; --line:#262B26; --line-2:#323832;
  --text:#F2F5F2; --text-2:#C9D0C9; --muted:#8F988F;
  --brand:#2E7D32; --signal:#4ACB55; --signal-ink:#06210A; --signal-wash:rgba(74,203,85,.12);
  --loss:#FF6B5E; --loss-wash:rgba(255,107,94,.12); --caution:#F2B84B; --caution-wash:rgba(242,184,75,.13);
  --display:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --ui:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-sm:10px; --tap:44px;
  color-scheme:dark;
  accent-color:var(--signal);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;caret-color:var(--signal)}
::selection{background:var(--signal);color:var(--signal-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
button,input,select,summary{font-family:inherit;color:inherit}
button{cursor:pointer;font-size:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:inherit}
ul,ol{margin:0;padding:0}
a{color:var(--signal);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
small{font-size:12px}
svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
svg.i.fill{fill:currentColor;stroke:none}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ---------------- Presenter bar ---------------- */
.stage{height:100%;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #151815;background:#080908;flex-shrink:0;flex-wrap:wrap}
.pbar .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-right:auto;min-width:0}
.pbar .who svg{width:24px;height:24px;flex-shrink:0}
.pbar .who small{color:var(--muted);font-weight:600;font-size:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;min-height:34px;padding:6px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.pbtn{border:1px solid var(--line-2);background:transparent;color:var(--text);font-weight:700;font-size:14px;min-height:36px;padding:7px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.pbtn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.jump{background:var(--surface);border:1px solid var(--line);border-radius:999px;min-height:36px;padding:6px 12px;font-weight:600;font-size:14px}

/* ---------------- Device frames ---------------- */
.floor{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 16px;position:relative}
.laptop{width:min(1320px,100%);height:100%;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid #2A2E2A;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.chrome{height:40px;flex-shrink:0;background:#151715;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #222622}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#3A3F3A;display:block}
.url{flex:1;max-width:520px;margin:0 auto;background:#0D0F0D;border:1px solid #232723;border-radius:8px;height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.phone{height:min(880px,100%);aspect-ratio:9/19.3;max-width:100%;border-radius:52px;padding:11px;background:#1a1c1a;box-shadow:0 0 0 2px #2c302c,0 24px 70px rgba(0,0,0,.6);position:relative;display:flex}
.phone .screen{flex:1;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:28px;border-radius:20px;background:#000;z-index:60}
.sbar{height:46px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 6px;font-size:14px;font-weight:700}
.sbar .icons{display:flex;gap:5px;align-items:center}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:3px;background:#F2F5F2;opacity:.8;z-index:60}
.native .floor{padding:0;align-items:stretch}
.native .app{height:100%}
.native .pbar{display:none!important}
.native .pbar{flex-wrap:nowrap;padding-block:8px;justify-content:flex-end}

/* ---------------- App shell ---------------- */
.app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg);container-type:inline-size;container-name:app;overflow:hidden}
.app-grid{flex:1;min-height:0;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.demo-strip{flex-shrink:0;font-size:12px;font-weight:600;color:var(--caution);background:var(--caution-wash);padding:5px 16px;text-align:center}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.wm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.wm svg{width:26px;height:26px}
.wm b{font-weight:400;color:var(--signal)}
.avatar{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text-2)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative}
.view{padding:8px 16px 32px;display:flex;flex-direction:column;gap:20px;max-width:1080px;width:100%;margin:0 auto}
.tabs{flex-shrink:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 4px 20px;background:var(--bg)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);min-height:52px;min-width:60px;padding:4px 4px}
.tab svg.i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] svg{color:var(--signal)}

@container app (min-width: 760px){
  .app-grid{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding:18px 14px;min-height:0}
  .side .wm{padding:2px 8px 18px}
  .nav{border:0;background:transparent;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--muted);min-height:44px;padding:10px 12px;border-radius:10px;text-align:left}
  .nav:hover{background:var(--surface);color:var(--text)}
  .nav[aria-current="page"]{background:var(--surface);color:var(--text)}
  .nav[aria-current="page"] svg{color:var(--signal)}
  .side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid var(--line);font-size:14px;font-weight:700}
  .side-user .avatar{width:34px;height:34px}
  .side-user small{display:block;color:var(--muted);font-weight:600;font-size:12px}
  .topbar,.tabs{display:none}
  .view{padding:28px 32px 56px;gap:24px}
}

/* ---------------- Shared ---------------- */
.h1{font-family:var(--ui);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.02em}
@container app (min-width: 760px){.h1{font-size:32px}}
.lead{font-size:16px;color:var(--text-2);max-width:60ch}
.sub{color:var(--muted);font-size:14px;max-width:62ch}
.head{display:flex;flex-direction:column;gap:8px}
.h2{font-size:16px;font-weight:800;letter-spacing:.05em;font-variant-caps:all-small-caps;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid transparent;border-radius:999px;font-weight:800;font-size:16px;min-height:48px;padding:12px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--signal-ink)}
.btn-primary:hover{background:#5ad865}
.btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{background:var(--surface)}
.btn-block{width:100%}
.link{border:0;background:transparent;color:var(--signal);font-weight:700;font-size:14px;padding:10px 0;min-height:var(--tap);text-align:left;display:inline-flex;align-items:center;gap:4px}
.back{border:0;background:transparent;color:var(--text-2);font-weight:700;font-size:14px;min-height:var(--tap);padding:0 8px 0 0;display:inline-flex;gap:4px;align-items:center;align-self:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;font-size:14px;min-height:var(--tap);padding:8px 16px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--signal-wash);border-color:rgba(74,203,85,.5);color:var(--signal)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--signal-wash);color:var(--signal)}
.pill.warn{background:var(--caution-wash);color:var(--caution)}
.pill.bad{background:var(--loss-wash);color:var(--loss)}
.pill.flat{background:var(--surface-2);color:var(--text-2)}
.up{color:var(--signal)} .down{color:var(--loss)} .muted{color:var(--muted)}
.callout{border-radius:var(--r);padding:16px;font-size:14px;line-height:1.55;color:var(--text-2);display:flex;flex-direction:column;gap:8px}
.callout b{color:var(--text)}
.callout.risk{background:var(--loss-wash);border:1px solid rgba(255,107,94,.35)}
.callout.good{background:var(--signal-wash);border:1px solid rgba(74,203,85,.35)}
.callout ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv dt,.kv span:first-child{color:var(--muted)}
.kv dd,.kv span:last-child{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;min-height:64px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.list > :last-child .row,.row:last-child{border-bottom:0}
button.row:hover{background:rgba(255,255,255,.02)}
.row .n{font-weight:800;font-size:16px}
.row .s{font-size:14px;color:var(--muted);margin-top:1px}
.row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{display:flex;align-items:center;justify-content:flex-end;gap:2px;font-size:14px;font-weight:700}
.logo-tile{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;color:#0B0D0B}
.rleft{display:flex;align-items:center;gap:12px;min-width:0}
details.more{border-top:1px solid var(--line)}
details.more:last-of-type{border-bottom:1px solid var(--line)}
details.more summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:52px;font-weight:800;font-size:16px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{transition:transform .2s}
details.more[open] summary svg{transform:rotate(180deg)}
details.more .body{padding:0 0 16px;color:var(--text-2);font-size:14px;line-height:1.65;max-width:65ch;display:flex;flex-direction:column;gap:10px}
.checks{list-style:none;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text-2)}
.checks li svg{color:var(--signal);margin-top:2px}

/* Spotlight for guided demo */
.spot{position:relative;z-index:5;outline:2px solid var(--signal);outline-offset:6px;border-radius:12px;animation:spot 1.8s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(74,203,85,0)}50%{box-shadow:0 0 0 8px rgba(74,203,85,.18)}}

/* ---------------- Onboarding ---------------- */
.ob{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.ob-inner{max-width:540px;width:100%;margin:0 auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px;flex:1}
.ob-top{display:flex;align-items:center;gap:12px;min-height:var(--tap)}
.ob-steps{flex:1;display:flex;gap:6px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2);display:block}
.ob-steps i.on{background:var(--signal)}
.ob-count{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ob-hero{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.ob-hero .mark{width:52px;height:52px}
.hero-h{font-family:var(--ui);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.025em}
.hero-h em{font-style:normal;color:var(--signal)}
.promise{display:flex;gap:10px;flex-wrap:wrap}
.promise span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.promise span svg{color:var(--signal)}
.ob-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.learn{list-style:none;display:flex;flex-direction:column}
.learn li{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.learn li:last-child{border-bottom:0}
.learn .ic{width:40px;height:40px;border-radius:12px;background:var(--signal-wash);color:var(--signal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.learn b{display:block;font-size:16px;margin-bottom:2px}
.learn p{font-size:14px;color:var(--text-2)}
.choice{display:grid;gap:10px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;min-height:56px;font-weight:700;font-size:16px}
.choice button[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-wash)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-height:48px;font-size:16px;font-weight:700;width:100%}
.input:focus{outline:2px solid var(--signal);outline-offset:0;border-color:var(--signal)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money .input{padding-left:26px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.verify{display:flex;align-items:center;gap:12px;min-height:56px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--signal);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.calc{font-size:14px;color:var(--text-2)}
.limit-big{font-size:44px;font-weight:800;letter-spacing:-.02em}

/* ---------------- Marketplace ---------------- */
.mk-grid{display:grid;grid-template-columns:1fr;gap:12px;list-style:none}
@container app (min-width: 760px){.mk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.offer{height:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:border-color .15s,transform .15s}
.offer:hover{border-color:var(--line-2);transform:translateY(-2px)}
.offer h2{font-size:20px;font-weight:800}
.offer .tagl{font-size:14px;color:var(--text-2)}
.from{display:flex;align-items:baseline;gap:8px}
.from b{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--signal)}
.from span{font-size:14px;color:var(--muted);font-weight:700}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.offer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);margin-top:auto}

/* ---------------- Company ---------------- */
.co-head{display:flex;gap:14px;align-items:center}
.co-head .logo-tile{width:52px;height:52px;border-radius:14px;font-size:20px}
.co-head .s{font-size:14px;color:var(--muted);font-weight:700}
.co-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@container app (min-width: 900px){.co-grid{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.terms{position:sticky;top:0}.investbar{display:none!important}}
.facts{display:flex;gap:24px;flex-wrap:wrap}
.facts div b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.facts div span{font-size:14px;color:var(--muted)}
.terms .fine{font-size:12px;color:var(--muted);line-height:1.5}
.investbar{position:sticky;bottom:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(11,13,11,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.investbar .from b{font-size:20px}
.co-grid .terms{display:none}
@container app (min-width: 900px){.co-grid .terms{display:flex}}
.doc-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-height:var(--tap);font-size:14px;font-weight:700;text-align:left;width:100%}
.doc-btn span:last-child{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.docs-mini{display:flex;flex-direction:column;gap:8px;list-style:none}

/* ---------------- Sheet ---------------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:22px 22px 0 0;width:100%;max-height:94%;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@container app (min-width: 760px){.scrim{align-items:center}.sheet{border-radius:20px;max-width:480px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line)}
.sheet-head .stepinfo{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.sheet-steps{display:flex;gap:5px}.sheet-steps i{flex:1;max-width:40px;height:4px;border-radius:2px;background:var(--line-2);display:block}.sheet-steps i.on{background:var(--signal)}

let chartRO;
function watchChart(){
  const ch = $("#chart"); if (!ch) return;
  if (window.ResizeObserver){
    if (chartRO) chartRO.disconnect();
    chartRO = new ResizeObserver(()=>{ const w = Math.round(ch.clientWidth); if (w && Math.abs(w-(S.chartW||0))>4){ S.chartW = w; ch.innerHTML = chartSVG(); } });
    chartRO.observe(ch);
  }
  if (!$("#pf-big")) return;
  let idx = null;
  const show = i => {
    const P = S._chart.pts; if (i==null){ idx=null; $("#pf-big").textContent = S._hero.big; const dl=$("#pf-delta"); dl.innerHTML = S._hero.delta; dl.className = "delta num "+(S._hero.up?"up":"down"); const ln=ch.querySelector("#scrub"), dt=ch.querySelector("#scrubdot"); if(ln){ln.setAttribute("opacity","0"); dt.setAttribute("opacity","0");} return; }
    idx = Math.max(0, Math.min(P.length-1, i)); const p = P[idx];
    $("#pf-big").textContent = usd(p.i);
    const ev = S.events.find(e=>e.date===p.d);
    const dl = $("#pf-delta"); dl.className = "delta num muted"; dl.textContent = fdate(p.d) + (ev ? " · " + ev.title : "");
    const ln = ch.querySelector("#scrub"), dt = ch.querySelector("#scrubdot");
    if (ln){ ln.setAttribute("x1",p.xv); ln.setAttribute("x2",p.xv); ln.setAttribute("opacity","1"); dt.setAttribute("cx",p.xv); dt.setAttribute("cy",p.yv); dt.setAttribute("opacity","1"); }
  };
  const fromX = cx => { const sv = ch.querySelector("svg"); const r = sv.getBoundingClientRect(); const vx = (cx - r.left) / r.width * S._chart.W; const P = S._chart.pts; let k = 0; P.forEach((p,j)=>{ if (p.xv <= vx) k = j; }); return k; };
  ch.addEventListener("pointermove", e => show(fromX(e.clientX)));
  ch.addEventListener("pointerdown", e => show(fromX(e.clientX)));
  ch.addEventListener("pointerleave", () => show(null));
  ch.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") show(null); });
  ch.addEventListener("keydown", e => { if (e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); e.stopPropagation(); const n = S._chart.pts.length; show(idx==null ? n-1 : idx + (e.key==="ArrowRight"?1:-1)); } if (e.key==="Escape") show(null); });
  ch.addEventListener("blur", () => show(null));
}

function amtList(){ const l=[25,100,250]; if (S.lastAmount && !l.includes(S.lastAmount)) l.push(S.lastAmount); return l; }

function amountLive(){

  return `<div class="receipt" id="receipt">

function chartSVG(){
  let pts = VALUE_SERIES.map(([d,c,i])=>({t:new Date(d+"T12:00:00").getTime(), d, c, i}));
  if (S.range==="12m"){
    const start = new Date("2028-10-17T12:00:00").getTime(), before = pts.filter(p=>p.t<=start).pop();
    pts = [{t:start, d:"2028-10-17", c:before.c, i:before.i}, ...pts.filter(p=>p.t>start)];
  }
  const appW = ($("#app")||{}).clientWidth || 1000;
  const W = Math.max(300, Math.round(S.chartW || Math.min(appW, 760))), H = W < 520 ? 200 : 240, T = 30, B = 10;
  const t0=pts[0].t, t1=pts[pts.length-1].t, lo = 0, hi = 3400;
  const x=t=>6+(t-t0)/(t1-t0)*(W-12), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const d = pts.map((p,k)=> k===0 ? `M${x(p.t).toFixed(1)} ${y(p.i).toFixed(1)}` : `H${x(p.t).toFixed(1)} V${y(p.i).toFixed(1)}`).join(" ");
  const at = dd => pts.find(p=>p.d===dd);
  const red = ["2029-06-30","2029-08-14"].map(at).filter(Boolean).map(pt=>`<circle cx="${x(pt.t)}" cy="${y(pt.i)}" r="4.5" fill="var(--bg)" stroke="var(--loss)" stroke-width="2.5"/>`).join("");
  const pay = at("2029-05-22");
  const payMark = pay ? `<circle cx="${x(pay.t)}" cy="${y(pay.i)}" r="5" fill="var(--signal)"/><text x="${x(pay.t)}" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="var(--signal)">$312 paid out</text><line x1="${x(pay.t)}" x2="${x(pay.t)}" y1="21" y2="${y(pay.i)-7}" stroke="var(--signal)" stroke-width="1" stroke-dasharray="2 3"/>` : "";
  const last = pts[pts.length-1];
  S._chart = { W, pts: pts.map(p=>({xv:x(p.t), yv:y(p.i), d:p.d, i:p.i})) };
  const table = `<div class="sr"><table><caption>Estimated value over time</caption><tr><th>Date</th><th>Estimated value</th></tr>${pts.map(p=>`<tr><td>${fdate(p.d)}</td><td>${usd(p.i)}</td></tr>`).join("")}</table></div>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;touch-action:pan-y" aria-hidden="true">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ACB55" stop-opacity=".16"/><stop offset="1" stop-color="#4ACB55" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} V${H} H${x(t0)} Z" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="var(--signal)" stroke-width="2.5" stroke-linejoin="round"/>
    ${red}${payMark}<circle cx="${x(last.t)}" cy="${y(last.i)}" r="5" fill="var(--signal)"/>
    <line id="scrub" x1="0" x2="0" y1="${T-6}" y2="${H}" stroke="var(--text-2)" stroke-width="1" opacity="0"/><circle id="scrubdot" r="5.5" fill="var(--text)" opacity="0"/></svg>${table}`;
}

  const t = e.target;
  if (t.name === "sav"){ S.ob.savings = t.value; render({keepScroll:true}); return; }
  if (t.matches("[data-ack]")){ S.modal.acks[+t.dataset.ack] = t.checked; render({keepScroll:true}); }
  if (t.id === "jump"){ const v = t.value; t.value=""; if(!v) return; if (S.guide.on) endGuide();
    if (v==="invest"){ go("company",{companyId:"fieldnote"}); openInvest("fieldnote"); }
    else if (v==="onboard"){ resetOnboard(); go("onboard"); }
    else if (v==="holding"){ go("holding",{holdingId:"tidewater"}); }
    else if (v==="invest-done"){ go("company",{companyId:"fieldnote"}); openInvest("fieldnote",25); S.modal.step=4; render({keepScroll:true, focus:"#sheet-h"}); }
    else if (v.startsWith("company:")) go("company",{companyId:v.split(":")[1]});
    else go(v); }
});
document.addEventListener("focusin", e => {
  const t = e.target, sc = t.closest && t.closest(".scroll"); if (!sc) return;
  const bar = sc.querySelector(".investbar"); if (!bar || getComputedStyle(bar).display==="none") return;
  const tb = t.getBoundingClientRect(), bb = bar.getBoundingClientRect();
  if (tb.bottom > bb.top - 8 && !bar.contains(t)) sc.scrollTop += tb.bottom - bb.top + 16;
});
document.addEventListener("focusout", e => { const t = e.target; if (t.dataset && t.dataset.obNum) t.value = (S.ob[t.dataset.obNum]||0).toLocaleString(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "amt-in"){
    const n = parseInt(t.value.replace(/[^0-9]/g,""),10) || 0;
    S.modal.amount = n; S.modal.custom = true; S.modal.raw = t.value;
    document.querySelectorAll(".amt").forEach(b=>b.setAttribute("aria-pressed","false"));
    $("#amt-live").innerHTML = amountLive(); $("#amt-next").disabled = !amountOk();
  }
  if (t.dataset.obNum){
    S.ob[t.dataset.obNum] = parseInt(t.value.replace(/[^0-9]/g,""),10) || 0;
    $("#ob-limit-val").innerHTML = usd(limit())+`<span class="muted" style="font-size:16px;font-weight:700"> a year</span>`; $("#ob-calc").textContent = limitMath(S.ob.income,S.ob.nw);
  }
});
document.addEventListener("keydown", e => {
  if (S.modal || S.info){
    if (e.key==="Escape"){ if (S.info) closeInfo(); else closeModal(); return; }
    if (e.key==="Tab"){
      const sheets = document.querySelectorAll(".sheet"), sheet = sheets[sheets.length-1]; if (!sheet) return;
      const f = [...sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),summary'), ...(S.guide.on && guideEl ? guideEl.querySelectorAll("button") : [])];
      if (!f.length) return;
      const first=f[0], last=f[f.length-1];
      if (!f.includes(document.activeElement)){ e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  }
});

function confirmInvest(){
  const m = S.modal; m.busy = true; render({keepScroll:true});
  setTimeout(()=>{
    if (!S.modal) return;
    const c = co(m.companyId), evId = "ev-new-"+Date.now();
    S.pending.push({companyId:m.companyId, amount:m.amount, evId});
    S.events.unshift({ id:evId, date:TODAY, group:"mine", co:m.companyId, type:"In escrow", tone:"warn",
      title:`You invested ${usd(m.amount)} in ${c.name}`, means:`<b>Waiting in escrow.</b> You can cancel until ${fdate(addDays(c.closes,-2))}.`,
      body:`Fee: ${usd2(fee(m.amount))}. North Capital holds the money until the raise closes on ${fdate(c.closes)}. If it misses its goal, the money comes back.` });
    delete S.drafts[m.companyId]; S.lastAmount = m.amount;
    m.busy = false; m.step = 4; render({keepScroll:true, focus:"#sheet-h"});
  }, 1400);
}

/* =========================================================
   GUIDED DEMO
   ========================================================= */
const GUIDE = [
  { title:"Open to everyone", body:"Only about 18.5% of U.S. households can join accredited-only deals. Here, every raise is open to you, from $25.",
    run(){ resetOnboard(); go("onboard"); }, spot:"#ob-hero" },
  { title:"Risks, right up front", body:"Before any company, you see what can go wrong, in plain words.",
    run(){ resetOnboard(); go("onboard"); }, spot:"#ob-risk" },
  { title:"A yearly limit, explained", body:"Anyone can invest, and the law caps how much each year. Jordan earns $48,000, so the cap is $2,500, and you can see why.",
    run(){ S.ob.step=4; S.ob.savings="yes"; S.ob.verify="done"; go("onboard"); }, spot:"#ob-limit" },
  { title:"Every raise is open", body:"Each company is open to every investor, with a $25 minimum. No countdowns, no hype.",
    run(){ go("marketplace"); }, spot:"#mk-head" },
  { title:"What it is, then the risks", body:"Each page says what the company does, then the risks. Details open when you want them.",
    run(){ go("company",{companyId:"fieldnote"}); }, spot:"#risk-first" },
  { title:"$25 in. Fee shown first.", body:"At $25 the fee is $2.50. You see every dollar before you confirm.",
    run(){ go("company",{companyId:"fieldnote"}); delete S.drafts.fieldnote; openInvest("fieldnote",25); }, spot:"#receipt" },
  { title:"Your money waits in escrow", body:"It goes to North Capital, never to us, and comes back if the raise misses its goal.",
    run(){ go("company",{companyId:"fieldnote"}); delete S.drafts.fieldnote; openInvest("fieldnote",25); S.modal.acks=[true,true,true,true]; S.modal.step=3; render({keepScroll:true}); }, spot:"#escrow-box" },
  { title:"Know what you own", body:"Two years in, Jordan's holdings are worth an estimated $2,620. Value changes only when something real happens.",
    run(){ S.range="all"; go("portfolio"); }, spot:"#pf-hero" },
  { title:"Every event, in dollars", body:"When Lumen raised money, Jordan's SAFE became shares and everyone's slice shrank 20%. You see what it means for you.",
    run(){ S.tlFilter="all"; go("timeline"); }, spot:"#ev-lumen-a" },
  { title:"Good news and bad", body:"A down round, a shutdown and a $312 payout all show up. We show losses too.",
    run(){ S.tlFilter="all"; go("timeline"); }, spot:"#ev-tide-down" },
  { title:"Open access. Real opportunity.", final:true, body:"Deals that usually need accreditation and $1,000+, open to everyone from $25.",
    run(){ go("marketplace"); }, spot:null }
];
let guideEl = null;
function startGuide(){ S.guide.on = true; S.guide.min = false; guideStep(0); }
function endGuide(){ S.guide.on = false; document.body.classList.remove("guiding"); document.body.style.removeProperty("--gh"); setTimeout(()=>render({keepScroll:true}),0); if (guideEl){ guideEl.remove(); guideEl=null; } document.querySelectorAll(".spot").forEach(el=>el.classList.remove("spot")); $("#guide-start").textContent="Start guided demo"; }
function guideStep(i){
  if (i<0) i=0; if (i>=GUIDE.length){ endGuide(); return; }
  S.guide.i = i; S.modal = null; S._spotDone = null;
  GUIDE[i].run(); renderGuide();
  $("#guide-start").textContent = "Restart guided demo";
}
function applySpot(){
  if (!S.guide.on) return;
  const g = GUIDE[S.guide.i]; if (!g || !g.spot) return;
  const el = $("#app") && $("#app").querySelector(g.spot);
  if (!el) return;
  el.classList.add("spot");
  if (S._spotDone !== S.guide.i){
    S._spotDone = S.guide.i;
    setTimeout(()=>{
      const sc = el.closest(".scroll, .ob, .sheet-body"); if (!sc) return;
      const er = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
      if (er.top >= sr.top && er.bottom <= sr.bottom) return;
      const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
      sc.scrollTo({top: Math.max(0, top - sc.clientHeight*0.15), behavior:"smooth"});
    }, 60);
  }
}
function renderGuide(){
  if (!guideEl){ guideEl = document.createElement("aside"); guideEl.className="guide"; guideEl.setAttribute("aria-label","Guided demo"); document.body.appendChild(guideEl); }
  const g = GUIDE[S.guide.i], n = GUIDE.length, last = S.guide.i===n-1, mini = S.guide.min && !S.native;
  guideEl.classList.toggle("min", mini);
  if (mini){
    guideEl.innerHTML = `<span class="mintitle" aria-live="polite"><span class="gstep">${S.guide.i+1}/${n}</span> ${esc(g.title)}</span>
      <button class="iconbtn" data-g-min aria-label="Show details">${icon("up","sm")}</button>
      <button class="pbtn primary" data-g-next>${last?"Finish":"Next"}</button>`;
  } else {
    const big = g.final ? `<div class="vs"><div><span>Accredited-only deals</span><b>$1,000+</b><span>open to about 18.5% of households</span></div><div class="us"><span>OpenVenture</span><b>$25</b><span>open to everyone</span></div></div>
      <p class="gfine">$1,000+: typical AngelList syndicate minimum. 18.5%: SEC, 2023.</p>
      <button class="btn btn-primary btn-block" data-waitlist>Join the early-access waitlist</button>` : "";
    guideEl.innerHTML = `<div class="gtop"><span class="gstep">Guided demo · ${S.guide.i+1} of ${n}</span><div style="display:flex;gap:2px">${S.native?"":`<button class="iconbtn" data-g-min aria-label="Minimize">${icon("down","sm")}</button>`}<button class="iconbtn" data-g-exit aria-label="End demo">${icon("x","sm")}</button></div></div>
      <div class="gbar" role="group" aria-label="Go to step">${GUIDE.map((g2,k)=>`<button class="${k<=S.guide.i?"on":""}" data-g-to="${k}" aria-label="Step ${k+1}: ${esc(g2.title)}" ${k===S.guide.i?'aria-current="step"':""}></button>`).join("")}</div>
      <div aria-live="polite"><h2>${esc(g.title)}</h2><p class="gbody">${esc(g.body)}</p></div>${big}
      <div class="gbtns">${S.guide.i>0?`<button class="pbtn" data-g-back>Back</button>`:""}${last?`<button class="pbtn" data-g-next>Close</button>`:`<button class="pbtn primary" data-g-next>Next</button>`}</div>`;
  }
  document.body.classList.add("guiding");
  document.body.style.setProperty("--gh", guideEl.offsetHeight + "px");
  const nx = guideEl.querySelector("[data-g-next]"); if (nx && S.guideFocus) nx.focus({preventScroll:true});
}
document.addEventListener("keydown", e => {
  if (!S.guide.on || S.info || (e.target.matches && e.target.matches("input,select,textarea"))) return;
  S.guideFocus = true;
  if (e.key==="ArrowRight") guideStep(S.guide.i+1);
  if (e.key==="ArrowLeft") guideStep(S.guide.i-1);
});

   ========================================================= */
const mq = window.matchMedia("(max-width: 640px)");
function setNative(){ S.native = mq.matches; document.body.classList.toggle("native", S.native); renderFrame(); render(); }
mq.addEventListener ? mq.addEventListener("change", setNative) : mq.addListener(setNative);
try { const saved = localStorage.getItem("ov-device"); if (saved==="phone"||saved==="laptop") S.device = saved; } catch(_){}
const qp = new URLSearchParams(location.search);
if (!qp.get("view") && !qp.get("tour")){ try { const sv = JSON.parse(sessionStorage.getItem("ov-ob")||"null"); if (sv && sv.ob){ Object.assign(S.ob, sv.ob, {verify: sv.ob.verify==="busy"?"idle":sv.ob.verify}); S.browse = !!sv.browse; } } catch(_){} }
if (qp.get("device")==="phone" || qp.get("device")==="laptop") S.device = qp.get("device");
const VIEWS = ["onboard","marketplace","company","portfolio","holding","timeline","documents","profile"];
let openInv = false;
if (qp.get("view")){ const v = qp.get("view"); if (v==="invest"){ S.view="company"; openInv=true; } else S.view = VIEWS.includes(v) ? v : "marketplace"; }
if (S.view==="holding" && !S.holdingId) S.holdingId = "tidewater";
setNative();
if (openInv) openInvest("fieldnote");
const tourN = parseInt(qp.get("tour"),10); if (tourN>=1 && tourN<=GUIDE.length){ S.guide.on = true; guideStep(tourN-1); }
})();
</script>
