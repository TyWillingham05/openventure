<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenVenture Click-Through</title>
<meta name="description" content="OpenVenture concept demo: a private-company investing marketplace and Portfolio Dashboard. Fictional companies and figures.">
<meta name="theme-color" content="#0B0D0B">
<link rel="icon" type="image/svg+xml" href="brand/openventure-app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Presenter stage holds one device frame (laptop browser or phone). The app inside adapts by its own width via container queries. */
:root{
  --stage:#050605;
  --bg:#0B0D0B; --surface:#171A17; --surface-2:#1F231F; --line:#262B26; --line-2:#323832;
  --text:#F2F5F2; --text-2:#C9D0C9; --muted:#8F988F;
  --brand:#2E7D32; --signal:#4ACB55; --signal-ink:#06210A; --signal-wash:rgba(74,203,85,.12);
  --loss:#FF6B5E; --loss-wash:rgba(255,107,94,.12); --caution:#F2B84B; --caution-wash:rgba(242,184,75,.13);
  --display:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --ui:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------------- Presenter bar ---------------- */
.stage{height:100%;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #151815;background:#080908;flex-shrink:0;flex-wrap:wrap}
.pbar .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-right:auto;min-width:0}
.pbar .who svg{width:24px;height:24px;flex-shrink:0}
.pbar .who small{color:var(--muted);font-weight:600;font-size:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:6px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.seg svg{width:14px;height:14px}
.pbtn{border:1px solid var(--line-2);background:transparent;color:var(--text);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:999px}
.pbtn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.jump{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px}

/* ---------------- Device frames ---------------- */
.floor{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 16px;position:relative}
.laptop{width:min(1320px,100%);height:100%;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid #2A2E2A;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.chrome{height:40px;flex-shrink:0;background:#151715;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #222622}
.dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;background:#3A3F3A;display:block}
.url{flex:1;max-width:520px;margin:0 auto;background:#0D0F0D;border:1px solid #232723;border-radius:8px;height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.url svg{width:12px;height:12px;flex-shrink:0}
.phone{height:min(860px,100%);aspect-ratio:9/19.3;max-width:100%;border-radius:52px;padding:11px;background:#1a1c1a;box-shadow:0 0 0 2px #2c302c,0 30px 80px rgba(0,0,0,.7);position:relative;display:flex}
.phone .screen{flex:1;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:28px;border-radius:20px;background:#000;z-index:60}
.sbar{height:46px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:13px;font-weight:700}
.sbar span:last-child{letter-spacing:1px;font-size:11px}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:3px;background:#F2F5F2;opacity:.8;z-index:60}
.native .floor{padding:0;align-items:stretch}
.native .app{height:100%}
.native .pbar .seg,.native .pbar .jump,.native .pbar .who small{display:none}
.native .pbar{flex-wrap:nowrap;padding-block:8px}

/* ---------------- App shell ---------------- */
.app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--bg);container-type:inline-size;container-name:app;overflow:hidden}
.app-grid{flex:1;min-height:0;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.demo-strip{flex-shrink:0;font-size:11px;font-weight:600;color:var(--caution);background:var(--caution-wash);padding:5px 16px;text-align:center}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.wm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:19px;font-weight:400;letter-spacing:-.01em}
.wm svg{width:26px;height:26px}
.wm b{font-weight:400;color:var(--signal)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--text-2)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.view{padding:6px 16px 28px;display:flex;flex-direction:column;gap:18px;max-width:1080px;width:100%;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabs{flex-shrink:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 4px 22px;background:var(--bg)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 6px;min-width:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] svg{color:var(--signal)}

@container app (min-width: 760px){
  .app-grid{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding:18px 14px;min-height:0}
  .side .wm{padding:2px 8px 18px}
  .nav{border:0;background:transparent;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left}
  .nav svg{width:20px;height:20px}
  .nav:hover{background:var(--surface);color:var(--text)}
  .nav[aria-current="page"]{background:var(--surface);color:var(--text)}
  .nav[aria-current="page"] svg{color:var(--signal)}
  .side-foot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.5;padding:0 8px}
  .side-user{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line);margin-top:12px;font-size:13px;font-weight:700}
  .side-user small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
  .topbar,.tabs{display:none}
  .view{padding:24px 32px 48px;gap:22px}
}

/* ---------------- Shared components ---------------- */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;letter-spacing:-.01em}
@container app (min-width: 760px){.h1{font-size:34px}}
.sub{color:var(--muted);font-size:14px;max-width:62ch}
.head{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid transparent;border-radius:999px;font-weight:800;font-size:14px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--signal-ink)}
.btn-primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--text)}
.btn-block{width:100%}
.link{border:0;background:transparent;color:var(--signal);font-weight:700;font-size:13px;padding:0;text-align:left}
.back{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:0;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--signal-wash);border-color:rgba(74,203,85,.5);color:var(--signal)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--signal-wash);color:var(--signal)}
.pill.warn{background:var(--caution-wash);color:var(--caution)}
.pill.bad{background:var(--loss-wash);color:var(--loss)}
.pill.flat{background:var(--surface-2);color:var(--text-2)}
.up{color:var(--signal)} .down{color:var(--loss)} .muted{color:var(--muted)}
.callout{border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.callout b{color:var(--text)}
.callout.risk{background:var(--loss-wash);border:1px solid rgba(255,107,94,.35)}
.callout.info{background:var(--surface);border:1px solid var(--line)}
.callout.good{background:var(--signal-wash);border:1px solid rgba(74,203,85,.35)}
.callout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.section-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
button.row:hover{background:rgba(255,255,255,.02)}
.row .n{font-weight:800;font-size:14.5px}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{display:block;font-size:12px;font-weight:700}
.logo-tile{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;color:#0B0D0B}
.rleft{display:flex;align-items:center;gap:12px;min-width:0}

/* Spotlight for guided demo */
.spot{position:relative;z-index:5;outline:2px solid var(--signal);outline-offset:2px;border-radius:12px;animation:spot 1.6s ease-in-out infinite}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(74,203,85,.0)}50%{box-shadow:0 0 0 8px rgba(74,203,85,.18)}}

/* ---------------- Onboarding ---------------- */
.ob{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.ob-inner{max-width:520px;width:100%;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px;flex:1}
.ob-steps{display:flex;gap:6px}
.ob-steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2);display:block}
.ob-steps i.on{background:var(--signal)}
.ob-hero{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:6px}
.ob-hero svg{width:56px;height:56px}
.ob-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.edu{display:grid;gap:10px}
.edu .card{display:flex;gap:12px;align-items:flex-start}
.edu .ic{width:36px;height:36px;border-radius:10px;background:var(--signal-wash);color:var(--signal);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.edu b{display:block;font-size:14.5px;margin-bottom:2px}
.edu p{font-size:13px;color:var(--text-2)}
.choice{display:grid;gap:10px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;font-weight:700;font-size:14px}
.choice button[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-wash)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:15px;font-weight:700;width:100%}
.input:focus{outline:none;border-color:var(--signal)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money .input{padding-left:26px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.verify{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--signal);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.calc{font-size:13.5px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.limit-big{font-size:34px;font-weight:800;letter-spacing:-.02em}

/* ---------------- Marketplace ---------------- */
.mk-grid{display:grid;grid-template-columns:1fr;gap:12px}
@container app (min-width: 760px){.mk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container app (min-width: 1040px){.mk-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:border-color .15s,transform .15s}
.offer:hover{border-color:var(--line-2);transform:translateY(-2px)}
.offer-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.offer h3{font-size:17px;font-weight:800}
.offer .tagl{font-size:13px;color:var(--text-2)}
.stats{display:flex;gap:18px}
.stats div b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.stats div span{font-size:11px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .meta b{color:var(--text)}
.offer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* ---------------- Company ---------------- */
.co-head{display:flex;gap:14px;align-items:center}
.co-head .logo-tile{width:52px;height:52px;border-radius:14px;font-size:19px}
.co-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@container app (min-width: 900px){.co-grid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.terms{position:sticky;top:0}}
.co-sec{display:flex;flex-direction:column;gap:8px}
.co-sec p{color:var(--text-2);font-size:14px;line-height:1.65;max-width:64ch}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;font-size:13.5px;color:var(--text-2)}
.checks li::before{content:"✓";color:var(--signal);font-weight:800}
.docs-mini{display:flex;flex-direction:column;gap:8px}
.doc-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px;font-weight:700;text-align:left;width:100%}
.doc-btn span:last-child{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.terms .fine{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------------- Sheet / modal ---------------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border:1px solid var(--line-2);border-radius:22px 22px 0 0;width:100%;max-height:92%;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@container app (min-width: 760px){.scrim{align-items:center}.sheet{border-radius:20px;max-width:480px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-steps{display:flex;gap:5px}.sheet-steps i{width:22px;height:4px;border-radius:2px;background:var(--line-2);display:block}.sheet-steps i.on{background:var(--signal)}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--text-2)}
.sheet-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:4px 18px 22px}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 4px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.amt[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-wash);color:var(--signal)}
.receipt{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.receipt .kv{padding:7px 0}
.receipt .tot span{color:var(--text)!important;font-size:15px}
.hint{font-size:12px;color:var(--muted)}
.hint.err{color:var(--loss);font-weight:700}
.ack{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--text-2);cursor:pointer}
.ack:last-child{border-bottom:0}
.ack input{width:18px;height:18px;accent-color:var(--signal);margin-top:2px;flex-shrink:0}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0}
.success svg{width:64px;height:64px}
.success circle{fill:none;stroke:var(--signal);stroke-width:3;stroke-dasharray:180;stroke-dashoffset:180;animation:draw .5s ease forwards}
.success path{fill:none;stroke:var(--signal);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .3s ease forwards .45s}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------------- Portfolio ---------------- */
.pf-top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container app (min-width: 900px){.pf-top{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.hero-v .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.hero-v .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
@container app (min-width: 760px){.hero-v .big{font-size:52px}}
.hero-v .delta{font-weight:800;font-size:14px;margin-top:6px}
.hero-v .est{font-size:11.5px;color:var(--muted);margin-top:3px}
.chart{width:100%;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:2.5px solid var(--signal);display:block}
.legend i.d{border-top:2px dashed var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile span{font-size:11.5px;color:var(--muted);font-weight:700}
.tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
.tiles.three{grid-template-columns:minmax(0,1fr)}
@container app (min-width: 760px){.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.limit-card{display:flex;flex-direction:column;gap:10px}
.limit-card .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.limit-card .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.escrow-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--caution-wash);border:1px solid rgba(242,184,75,.35);border-radius:var(--r);padding:12px 14px}
.lock{display:inline-block;margin-top:4px}

/* ---------------- Timeline ---------------- */
.tl{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ev::before{content:"";position:absolute;left:-21px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dot,var(--muted))}
.ev-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ev-date{font-size:12px;color:var(--muted);font-weight:700}
.ev h3{font-size:15px;font-weight:800}
.ev p{font-size:13.5px;color:var(--text-2)}
.means{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-2)}
.means b{color:var(--text)}
.ev-delta{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}

/* ---------------- Toast ---------------- */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90%;text-align:center;animation:fadein .2s ease}

/* ---------------- Guide panel ---------------- */
.guide{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:min(370px,calc(100% - 36px));background:#101210;border:1px solid var(--line-2);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:100;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.guide .gtop{display:flex;justify-content:space-between;align-items:center}
.guide .gstep{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.guide h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2}
.guide p{font-size:13.5px;color:var(--text-2);line-height:1.55}
.guide .gbar{display:flex;gap:4px}.guide .gbar i{flex:1;height:3px;border-radius:2px;background:var(--line-2);display:block}.guide .gbar i.on{background:var(--signal)}
.guide .gbtns{display:flex;gap:8px;justify-content:flex-end}
.guide .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guide .nums div{background:var(--surface);border-radius:10px;padding:8px 10px}
.guide .nums b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.guide .nums span{font-size:11px;color:var(--muted)}
.guide .gfine{font-size:11px;color:var(--muted)}
.guide.min{width:auto;padding:10px 14px}
.native .guide{left:12px;right:12px;width:auto;bottom:12px}

}

function chartSVG(){
  let pts = VALUE_SERIES.map(([d,c,i])=>({t:new Date(d+"T12:00:00").getTime(), d, c, i}));
  if (S.range==="12m"){
    const start = new Date("2028-10-17T12:00:00").getTime();
    const before = pts.filter(p=>p.t<=start).pop();
    pts = [{t:start, d:"2028-10-17", c:before.c, i:before.i}, ...pts.filter(p=>p.t>start)];
  }
  const appW = ($("#app")||{}).clientWidth || 1000, narrow = appW < 760;
  const W = narrow ? 360 : 640, H = narrow ? 210 : 220, L = narrow ? 36 : 44, R = 12, T = 14, B = 26;
  const t0=pts[0].t, t1=pts[pts.length-1].t, maxV=3500;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-v/maxV)*(H-T-B);
  const step = key => pts.map((p,k)=> k===0 ? `M${x(p.t).toFixed(1)} ${y(p[key]).toFixed(1)}` : `H${x(p.t).toFixed(1)} V${y(p[key]).toFixed(1)}`).join(" ");
  const grid = [0,1000,2000,3000].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v===0?"$0":"$"+v/1000+"K"}</text>`).join("");
  const ticks = (S.range==="12m" ? ["2028-10-17","2029-02-10","2029-06-01","2029-10-17"] : ["2028-03-14","2028-09-01","2029-03-01","2029-10-17"]).map(d=>{const t=new Date(d+"T12:00:00").getTime();return `<text x="${x(t)}" y="${H-6}" text-anchor="${t===t0?"start":t===t1?"end":"middle"}" font-size="11" fill="var(--muted)">${d===TODAY?"Today":fdate(d,true)}</text>`}).join("");
  const evDots = pts.slice(1,-1).filter((p,k,arr)=>true).map(p=>`<circle cx="${x(p.t)}" cy="${y(p.i)}" r="3.5" fill="var(--bg)" stroke="var(--signal)" stroke-width="2"><title>${fdate(p.d)}: ${usd(p.i)} indicated</title></circle>`).join("");
  const last = pts[pts.length-1];
  const area = step("i") + ` V${y(0)} H${x(t0)} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Indicated value over time compared with amount invested">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ACB55" stop-opacity=".22"/><stop offset="1" stop-color="#4ACB55" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ga)"/>
    <path d="${step("c")}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 5"/>
    <path d="${step("i")}" fill="none" stroke="var(--signal)" stroke-width="2.8" stroke-linejoin="round"/>
    ${evDots}<circle cx="${x(last.t)}" cy="${y(last.i)}" r="5" fill="var(--signal)"/>${ticks}</svg>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-scrim], .ack"); if (!t) return;
  if (t.matches("[data-scrim]") && e.target === t){ S.modal=null; S._keepScroll=true; render(); return; }

  if (d.device){ S.device = d.device; renderFrame(); render(); return; }
  if (t.id === "guide-start"){ startGuide(); return; }
  if (d.go){ go(d.go, {anchor:d.anchor}); return; }
  if (d.company){ go("company", {companyId:d.company}); return; }
  if (d.holding){ go("holding", {holdingId:d.holding}); return; }
  if (d.mk){ S.mkFilter = d.mk; S._keepScroll=true; render(); return; }
  if (d.tl){ S.tlFilter = d.tl; S._keepScroll=true; render(); return; }
  if (d.range){ S.range = d.range; S._keepScroll=true; render(); return; }
  if (d.doc){ toast(`Demo document: "${d.doc}". In the live app this opens the PDF.`); return; }
  if (d.invest){ openInvest(d.invest); return; }
  if (d.close != null){ S.modal=null; S._keepScroll=true; render(); return; }
  if (d.amt){ S.modal.amount = +d.amt; S.modal.custom=false; S._keepScroll=true; render(); return; }

  if (d.closeGo){ const v=d.closeGo; S.modal=null; go(v); return; }
  if (d.obNext != null){ S.ob.step++; render(); return; }
  if (d.savings){ S.ob.savings = d.savings; render(); return; }
  if (d.verify != null){ S.ob.verify="busy"; render(); setTimeout(()=>{ S.ob.verify="done"; render(); }, 1300); return; }

  if (d.gNext != null){ guideStep(S.guide.i+1); return; }
  if (d.gBack != null){ guideStep(S.guide.i-1); return; }
  if (d.gExit != null){ endGuide(); return; }
  if (d.gMin != null){ S.guide.min = !S.guide.min; renderGuide(); return; }
});

      <div><b>12.8×</b><span>5-year LTV / CAC (5.9× blended)</span></div><div><b>$600K</b><span>$100K founders + $500K seed</span></div></div>
      <p class="gfine">Planning estimates from the OpenVenture financial plan, not promises. Assumes portal approval (targeted Oct 2027).</p>` : "";
  guideEl.innerHTML = `<div class="gtop"><span class="gstep">Guided demo · ${S.guide.i+1} of ${n}</span><div style="display:flex;gap:6px"><button class="pbtn" data-g-min aria-label="Minimize">–</button><button class="pbtn" data-g-exit aria-label="End demo">✕</button></div></div>
    <div class="gbar">${GUIDE.map((_,k)=>`<i class="${k<=S.guide.i?"on":""}"></i>`).join("")}</div>
    <h2>${esc(g.title)}</h2><p>${esc(g.body)}</p>${nums}
    <div class="gbtns">${S.guide.i>0?`<button class="pbtn" data-g-back>Back</button>`:""}<button class="pbtn primary" data-g-next>${S.guide.i===n-1?"Finish":"Next"}</button></div>`;
}
document.addEventListener("keydown", e => {
  if (!S.guide.on || e.target.matches("input,select,textarea")) return;
  if (e.key==="ArrowRight") guideStep(S.guide.i+1);
  if (e.key==="ArrowLeft") guideStep(S.guide.i-1);
});

   BOOT
   ========================================================= */
const mq = window.matchMedia("(max-width: 640px)");
function setNative(){ S.native = mq.matches; document.body.classList.toggle("native", S.native); renderFrame(); render(); }
mq.addEventListener ? mq.addEventListener("change", setNative) : mq.addListener(setNative);
try { const saved = localStorage.getItem("ov-device"); if (saved==="phone"||saved==="laptop") S.device = saved; } catch(_){}
const qp = new URLSearchParams(location.search);
if (qp.get("device")==="phone" || qp.get("device")==="laptop") S.device = qp.get("device");
if (qp.get("view")) S.view = qp.get("view");
document.querySelectorAll("[data-device]").forEach(b=>b.addEventListener("click",()=>{ try{ localStorage.setItem("ov-device", b.dataset.device); }catch(_){} }));
setNative();
})();
</script>
